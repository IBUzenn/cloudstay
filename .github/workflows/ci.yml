name: CloudStay CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test-backend:
    name: Backend Unit & Integration Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: 'CloudStay/backend/package-lock.json'

      - name: Install Backend Dependencies
        run: |
          cd CloudStay/backend
          npm ci

      - name: Run Backend Tests & Coverage
        run: |
          cd CloudStay/backend
          npm run test:coverage

  build-frontend:
    name: Frontend Production Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: 'CloudStay/frontend/package-lock.json'

      - name: Install Frontend Dependencies
        run: |
          cd CloudStay/frontend
          npm ci

      - name: Build Frontend Application
        run: |
          cd CloudStay/frontend
          npm run build
